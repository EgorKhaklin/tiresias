[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glass-private-intelligence"
version = "0.1.0"
description = "Verifiable private analytics: commit sensitive datasets, prove aggregate queries in zero-knowledge. Built on Glass."
authors = [{name = "Egor Khaklin"}]
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["zero-knowledge", "privacy", "analytics", "stark", "verifiable-computation", "glass"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security :: Cryptography",
    "Programming Language :: Python :: 3 :: Only",
]
# Glass (glass-lang) is the proving engine, needed only by the LOCAL PROVER. It
# is resolved at runtime from GPI_GLASS_DIR (default ~/Desktop/Glass) and treated
# as read-only. The registry server does NOT need it (it verifies bindings only).
# Pure-stdlib otherwise — no third-party dependencies.
dependencies = []

[project.urls]
Repository = "https://github.com/EgorKhaklin/glass-private-intelligence"
"Built on Glass" = "https://github.com/EgorKhaklin/Glass"

[project.scripts]
gpi = "gpi.cli:main"

[tool.setuptools.packages.find]
include = ["gpi*"]

[tool.setuptools.package-data]
"gpi.web" = ["*.html"]
"gpi.registry" = ["*.html"]

[tool.pyright]
include = ["gpi", "spike.py"]
extraPaths = ["."]
