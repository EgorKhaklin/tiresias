# Self-hosted Tiresias registry.
#
# The registry stores manifests + proof bundles and verifies bindings. It never
# sees raw data. Proving runs on the data-holder's own machine via the local
# prover CLI (`tiresias remote-commit` / `tiresias remote-query`), which needs the Glass
# engine and is intentionally NOT containerized here: it lives where the data
# lives.
#
#   docker compose -f deploy/docker-compose.yml up --build
#   # then provision an org inside the container:
#   docker compose -f deploy/docker-compose.yml exec registry tiresias create-org "Acme"

services:
  registry:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.registry
    ports:
      - "8765:8765"
    volumes:
      - tiresias-data:/data
    environment:
      TIRESIAS_LOG_LEVEL: INFO
    restart: unless-stopped

volumes:
  tiresias-data:
