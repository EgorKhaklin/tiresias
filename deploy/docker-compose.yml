# Self-hosted Tiresias registry.
#
# The registry stores manifests and proof bundles and verifies their receipts. It
# never sees raw data. Proving runs on the data holder's own machine
# (`tiresias remote-commit` / `tiresias remote-query`), which needs RISC Zero's
# r0vm and is intentionally NOT containerized here: it lives where the data lives.
#
#   docker compose -f deploy/docker-compose.yml up --build
#   # then provision an org inside the container:
#   docker compose -f deploy/docker-compose.yml exec registry tiresias create-org "Acme"

services:
  registry:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.registry
    ports:
      - "8765:8765"
    volumes:
      - tiresias-data:/data
    environment:
      TIRESIAS_LOG_LEVEL: INFO
    restart: unless-stopped

volumes:
  tiresias-data:
