<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiresias: verified result</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b0f14'/><path d='M16 6L26 25H6Z' fill='none' stroke='%235cc8ff' stroke-width='2.6' stroke-linejoin='round'/></svg>">
<style>
  :root { --bg:#0b0f14; --panel:rgba(255,255,255,.04); --line:rgba(255,255,255,.10);
    --ink:#e8eef5; --dim:#8aa0b4; --accent:#5cc8ff; --ok:#4ade80; --bad:#f87171; --warn:#fbbf24; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:680px; margin:0 auto; padding:40px 22px 80px; }
  .brand { color:var(--dim); font-size:13px; letter-spacing:.04em; }
  .brand .glass { color:var(--accent); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:26px 28px; margin-top:16px; }
  .answer { font-size:30px; font-weight:700; margin:6px 0 2px; }
  .query { font-family:ui-monospace,Menlo,monospace; color:var(--dim); font-size:14px; }
  .org { margin-top:14px; color:var(--ink); }
  .verdict { display:inline-flex; align-items:center; gap:8px; margin-top:18px; padding:8px 14px; border-radius:99px; font-weight:700; }
  .verdict.ok { background:rgba(74,222,128,.12); color:var(--ok); }
  .verdict.bad { background:rgba(248,113,113,.12); color:var(--bad); }
  .kv { display:grid; grid-template-columns:130px 1fr; gap:6px 14px; margin-top:20px; font-size:13.5px; }
  .kv b { color:var(--dim); font-weight:500; }
  .mono { font-family:ui-monospace,Menlo,monospace; word-break:break-all; }
  .checks { margin-top:16px; font-size:13px; }
  .checks div { padding:3px 0; }
  .m.ok{color:var(--ok);font-weight:700;} .m.bad{color:var(--bad);font-weight:700;}
  .note { margin-top:18px; color:var(--dim); font-size:12.5px; border-top:1px solid var(--line); padding-top:14px; }
  .badge { font-size:11px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--warn); }
  .err { color:var(--bad); }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Tiresias: public verification</div>
  <div id="content" class="card">loading…</div>
</div>
<script>
const token = location.pathname.split("/").filter(Boolean).pop();
const C = document.getElementById("content");

function fmtResult(r) {
  if ("groups" in r) return Object.entries(r.groups).map(([k,v]) => `${k}: ${v}`).join("  ·  ");
  if ("value" in r) return r.value;
  if ("avg" in r) return `${r.avg} (sum ${r.sum} / count ${r.count})`;
  return JSON.stringify(r);
}

(async () => {
  try {
    const r = await fetch(`/share/${token}`);
    const j = await r.json();
    if (!r.ok) { C.innerHTML = `<div class="err">${j.error||"not found"}</div>`; return; }
    const v = j.verification, ok = v.ok;
    C.innerHTML = `
      <div class="query">${j.bundle.query}</div>
      <div class="answer">${fmtResult(j.bundle.result)}</div>
      <div class="org">attested by <b>${j.org||"unknown"}</b></div>
      <div class="verdict ${ok?'ok':'bad'}">${ok?'✓ VERIFIED':'✗ NOT VERIFIED'}: answer bound to a published commitment</div>
      <div class="checks">${v.checks.map(c=>`<div><span class="m ${c.passed?'ok':'bad'}">${c.passed?'PASS':'FAIL'}</span> ${c.name}</div>`).join("")}</div>
      <div class="kv">
        <b>commitment</b><span class="mono">${j.bundle.commitment}</span>
        <b>dataset</b><span class="mono">${j.dataset ? (j.dataset.name||j.dataset.dataset_id) : 'unknown'}</span>
        <b>proof</b><span>${j.bundle.accepted ? 'ACCEPT' : 'REJECT'} <span class="badge">crypto: ${j.bundle.crypto_grade}</span></span>
      </div>
      <div class="note">This confirms the answer is cryptographically bound to a dataset the organization
      publicly committed to (binding verification). The data itself is never revealed, and the answer
      cannot be swapped without breaking the commitment. Re-running the full proof (Tier 2) requires the
      committed data and is performed by the data-holder. ${j.bundle.disclosure||''}</div>`;
  } catch (e) {
    C.innerHTML = `<div class="err">error: ${e.message}</div>`;
  }
})();
</script>
</body>
</html>
