[package]
name = "tiresias-prover"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[[bin]]
name = "tiresias-prover"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bincode = "1.3.3"
hex = "0.4"
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["client", "disable-dev-mode", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiresias-core = { path = "../core" }

